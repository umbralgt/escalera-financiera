<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escalera financiera · Lab 3 · UMBRAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Sistema visual UMBRAL (Lab 1 y Lab 2). Color: blanco y negro de base; azul #2f5bd3 como único acento;
   verde, ámbar y rojo solo para el semáforo y los errores, siempre en tinte suave (igual que .traffic-* de Lab 1);
   otros colores (morado, naranja, verde de mapa) solo para distinguir categorías de datos, como las capas de Lab 1. */
:root{
  --negro:#0a0a0a; --blanco:#ffffff; --suelo:#f4f4f2; --g200:#efefef; --g300:#e3e3e3; --g400:#cfcfcf; --g600:#6b6b6b;
  --azul:#2f5bd3; --azul-claro:#eef2fc;
  --verde:#1f7a3b; --verde-claro:#e7f6ec; --ambar:#c79200; --ambar-claro:#fff7da; --rojo:#c0392b; --rojo-claro:#ffe3e3;
  --linea:1.5px solid var(--negro); --suave:1px solid var(--g300);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --negro:#f2f2f0; --blanco:#111111; --suelo:#1a1a1a; --g200:#262626; --g300:#333333; --g400:#4a4a4a; --g600:#a3a3a3;
    --azul:#7f9ff0; --azul-claro:#1c2540; --verde:#6cc48a; --verde-claro:#16301f; --ambar:#e6b84a; --ambar-claro:#33290f; --rojo:#ef8a7c; --rojo-claro:#3a1c18;
  }
}
:root[data-theme="dark"]{
  --negro:#f2f2f0; --blanco:#111111; --suelo:#1a1a1a; --g200:#262626; --g300:#333333; --g400:#4a4a4a; --g600:#a3a3a3;
  --azul:#7f9ff0; --azul-claro:#1c2540; --verde:#6cc48a; --verde-claro:#16301f; --ambar:#e6b84a; --ambar-claro:#33290f; --rojo:#ef8a7c; --rojo-claro:#3a1c18;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(54px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--blanco);color:var(--negro);font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--negro)}
:focus-visible{outline:2px solid var(--azul);outline-offset:2px}

/* Barra de navegación, igual a Lab 1 y Lab 2 */
#nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--blanco);border-bottom:var(--linea)}
#nav .logo{font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--negro);text-decoration:none;white-space:nowrap}
#nav .mods{display:flex;gap:4px;flex:1;justify-content:center}
#nav .mod{padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--g600);border-radius:6px;text-decoration:none}
#nav .mod.activo{color:var(--negro);background:var(--g200)}
#nav .volver{margin-left:auto;display:inline-flex;gap:8px;padding:8px 14px;background:var(--negro);color:var(--blanco);font-size:12px;font-weight:500;border-radius:8px;text-decoration:none;white-space:nowrap}
#nav .logo{min-width:0;overflow:hidden;text-overflow:ellipsis}
#nav .volver{flex:none}
@media (max-width:560px){#nav .mods{display:none}#nav{padding:0 14px;gap:8px}#nav .volver{padding:8px 12px}}

main{max-width:680px;margin:0 auto;padding:28px 20px 48px}
.ceja{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin:0 0 10px}
h1{font-size:2.1rem;line-height:1.1;letter-spacing:-.03em;font-weight:700;margin:0 0 14px}
h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin:36px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--g300)}
h3{font-size:1rem;font-weight:700;margin:0 0 6px}
p{margin:0 0 14px}
.suave{color:var(--g600)}
.chico{font-size:.88rem;line-height:1.5}
.nota-lab{border:var(--linea);border-radius:8px;padding:14px 16px;margin:20px 0}
.nota-lab b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px}
.aviso{background:var(--ambar-claro);border:1.5px solid var(--ambar);border-radius:8px;padding:10px 14px;font-size:.85rem;color:var(--ambar);margin:0 0 20px}
.aviso strong{font-weight:700}
.btn{display:block;width:100%;padding:13px;border:var(--linea);border-radius:8px;background:var(--negro);color:var(--blanco);font-size:15px;font-weight:700;text-align:center}
.btn:hover{opacity:.88}
.btn.sec{background:var(--blanco);color:var(--negro)}
.btn.sec:hover{background:var(--g200);opacity:1}
.enlace{background:none;border:0;padding:4px 0;color:var(--negro);text-decoration:underline;text-underline-offset:3px;font-size:.95rem}
.fila{display:flex;gap:10px;margin-top:20px}
.fila .btn{flex:1}

/* Pregunta */
.avance{height:4px;background:var(--g300);border-radius:2px;overflow:hidden;margin-bottom:10px}
.avance i{display:block;height:100%;background:var(--negro);transition:width .3s}
.bloque{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin-bottom:24px}
.pregunta{font-size:1.55rem;line-height:1.25;letter-spacing:-.02em;font-weight:700;margin:0 0 8px}
.opciones{display:grid;gap:8px;margin-top:20px}
.op{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:8px;border:1.5px solid var(--g400);background:var(--blanco);font-size:1rem;font-weight:500}
.op:hover{border-color:var(--negro)}
.op[aria-pressed="true"]{border-color:var(--negro);background:var(--negro);color:var(--blanco)}
.op .caja{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor}
.op.multi .caja{border-radius:4px}
.op[aria-pressed="true"] .caja{background:var(--blanco);box-shadow:inset 0 0 0 3px var(--negro)}
.monto{display:flex;align-items:center;border:1px solid var(--g400);border-radius:8px;background:var(--suelo);margin-top:20px}
.monto:focus-within{border-color:var(--negro);background:var(--blanco);box-shadow:0 0 0 1px var(--negro)}
.monto span{padding:0 2px 0 16px;font-size:1.5rem;font-weight:700;color:var(--g600)}
.monto input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.5rem;font-weight:700;padding:12px 16px 12px 4px;color:var(--negro)}
.monto input:focus{outline:none}
.unidad{display:flex;gap:8px;margin-top:10px}
.unidad .op{flex:1;justify-content:center;padding:10px}
.nose{margin-top:10px}
.ayuda{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.help-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--negro);background:var(--blanco);font-size:12px;font-weight:700;color:var(--negro);padding:0;line-height:1}
.help-icon:hover,.help-icon[aria-expanded="true"]{background:var(--negro);color:var(--blanco)}
.help-lbl{font-size:.9rem;color:var(--g600)}
.help-bubble{flex-basis:100%;background:var(--blanco);border:1.5px solid var(--negro);border-radius:10px;padding:12px 14px;font-size:.92rem;line-height:1.65;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.error{color:var(--rojo);font-size:.95rem;margin-top:8px;min-height:1.4rem}

/* Escalera */
.lugar{font-size:2rem;line-height:1.1;letter-spacing:-.03em;font-weight:700;margin:4px 0 8px}
.escalera{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column-reverse}
.peldano{display:flex;align-items:center;gap:14px;padding:7px 0}
.peldano .travesano{flex:none;width:72px;height:12px;border:1.5px solid var(--g400);border-radius:2px;position:relative}
.peldano .travesano::before,.peldano .travesano::after{content:"";position:absolute;top:-10px;bottom:-10px;width:1.5px;background:var(--g400)}
.peldano .travesano::before{left:-1.5px}.peldano .travesano::after{right:-1.5px}
.peldano.hecho .travesano{background:var(--negro);border-color:var(--negro)}
.peldano.aqui .travesano{background:var(--azul);border-color:var(--azul);height:16px}
.peldano .nombre{font-size:.95rem;color:var(--g600)}
.peldano.hecho .nombre{color:var(--negro)}
.peldano.aqui .nombre{color:var(--azul);font-weight:700}
.peldano.lejos{opacity:.55}

/* Tropiezo */
.tropiezo{border:var(--linea);border-radius:10px;padding:16px;margin-top:12px}
/* Semáforo como el traffic-box de Lab 1: tinte suave, borde del mismo tono, sin mayúsculas */
.semaforo{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:6px;border:1.5px solid}
.semaforo::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.semaforo.verde{color:var(--verde);background:var(--verde-claro)}
.semaforo.amarillo{color:var(--ambar);background:var(--ambar-claro)}
.semaforo.rojo{color:var(--rojo);background:var(--rojo-claro)}
.cifra{font-size:1.8rem;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:10px 0 6px}
.pestanas{display:flex;gap:0;border:var(--linea);border-radius:8px;overflow:hidden;width:fit-content;margin:4px 0 14px}
.pestanas .op{border:0;border-radius:0;padding:8px 14px;font-size:12px;font-weight:700}
.pestanas .op .caja{display:none}
.compara{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.compara div{background:var(--suelo);border:var(--suave);border-radius:8px;padding:10px 12px;font-size:.9rem}
.compara b{display:block;font-size:1.2rem;letter-spacing:-.02em}
.calma{background:var(--suelo);border:var(--linea);border-radius:10px;padding:16px;margin-top:20px}

/* Hallazgos */
.hallazgo{border:var(--suave);border-radius:10px;padding:16px;margin-top:10px}
.familia{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin-bottom:6px}
.hallazgo .vimos{font-weight:700;font-size:1.08rem;letter-spacing:-.01em;margin-bottom:8px}
.de100{border-left:3px solid var(--azul);background:var(--azul-claro);padding:8px 12px;border-radius:0 8px 8px 0;margin:12px 0}
.paso{margin-top:10px}
.nota{font-size:.85rem;color:var(--g600);margin-top:8px}
.pie{font-size:.8rem;color:var(--g600);border-top:var(--suave);margin-top:12px;padding-top:8px}
.marca-verif{display:inline-block;font-size:12px;font-weight:700;border:1.5px solid var(--ambar);color:var(--ambar);background:var(--ambar-claro);padding:2px 8px;border-radius:6px;margin-top:8px}

/* Cómo funciona */
.tabla{overflow-x:auto;margin:12px 0;border:var(--suave);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.82rem;min-width:30rem}
th,td{text-align:left;padding:7px 9px;border-bottom:var(--suave);vertical-align:top}
th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--g600)}

footer{background:#0a0a0a;padding:28px 20px;margin-top:48px}
.pie-in{max-width:680px;margin:0 auto}
footer .lema{font-size:20px;font-weight:700;color:#fff;letter-spacing:-.02em;margin:0 0 6px}
footer .per{font-size:12px;color:#777;font-style:italic;margin:0 0 20px}
.pie-fila{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:16px;border-top:1px solid #1e1e1e}
.pie-fila span{font-size:11px;color:#777;font-weight:500}
.pie-fila a{display:inline-flex;gap:8px;padding:7px 14px;background:#fff;color:#0a0a0a;font-size:11px;font-weight:500;border-radius:8px;text-decoration:none}

/* v1.1: ajustes de la primera prueba con usuario */
.porque{background:var(--suelo);border-left:3px solid var(--azul);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.92rem;margin:10px 0 0}
.term{display:inline;background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
.def{display:block;background:var(--blanco);color:var(--negro);border:1.5px solid var(--negro);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem;font-weight:400;line-height:1.55;letter-spacing:0;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.def b{font-weight:700}
.term[aria-expanded="true"]{background:var(--azul-claro)}
.explica{border:1.5px solid var(--negro);border-radius:10px;padding:12px 14px;margin-top:12px}
.explica b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px}
.explica p{margin:0}
.desglose{display:grid;gap:8px;margin-top:20px}
.fila-gasto{display:flex;align-items:center;gap:12px;justify-content:space-between}
.fila-gasto .lbl{flex:1;font-weight:600;font-size:.98rem;line-height:1.3}
.fila-gasto small{display:block;font-weight:400;color:var(--g600);font-size:.8rem}
.chico-monto{margin-top:0;width:9rem;flex:none}
.chico-monto span{font-size:1rem;padding-left:12px}
.chico-monto input{font-size:1.05rem;padding:9px 10px 9px 2px}
.total-gasto{display:flex;justify-content:space-between;border-top:var(--linea);padding-top:10px;margin-top:4px;font-weight:700}
.resumen{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dato{border:var(--suave);border-radius:10px;padding:12px}
.dato span{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g600)}
.dato b{display:block;font-size:1.35rem;letter-spacing:-.02em}
.dato small{display:block;font-size:.78rem;color:var(--g600);line-height:1.35}
.pasos-esc{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.paso-esc{display:flex;gap:12px;padding:12px;border:var(--suave);border-radius:10px}
.paso-esc .marca{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:1.5px solid var(--g400);color:var(--g600)}
.paso-esc.cumple .marca{background:var(--negro);color:var(--blanco);border-color:var(--negro)}
.paso-esc.aqui{border:1.5px solid var(--azul);background:var(--azul-claro)}
.paso-esc.aqui .marca{border-color:var(--azul);color:var(--azul)}
.paso-esc.despues{opacity:.7}
.paso-esc p{margin:4px 0 0;font-size:.93rem}
.etq{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g600);margin:12px 0 2px}
.hallazgo .vimos{margin-bottom:4px}
.siguiente{border:var(--linea);border-radius:10px;padding:16px}
.siguiente .etq{margin-top:0}
.sig-texto{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.mini-esc{margin:0 0 14px;padding:0;list-style:none;counter-reset:p;display:grid;gap:6px}
.mini-esc li{counter-increment:p;display:flex;gap:10px;align-items:baseline;font-size:.95rem;color:var(--g600)}
.mini-esc li::before{content:counter(p);flex:none;width:22px;height:22px;border-radius:50%;background:var(--negro);color:var(--blanco);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transform:translateY(4px)}
.mini-esc b{color:var(--negro)}

/* v1.2: segunda prueba con usuario */
.breve{border:var(--linea);border-radius:10px;padding:16px;margin-top:4px}
.breve:focus{outline:none}
.breve .lugar{font-size:1.6rem}
.breve .siguiente{margin-top:14px;background:var(--azul-claro);border:1.5px solid var(--azul)}
.bloque-r{border:var(--linea);border-radius:10px;margin-top:10px}
.bloque-r summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.bloque-r summary::-webkit-details-marker{display:none}
.bloque-r .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--negro);color:var(--blanco);font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.bloque-r .tit{flex:1}
.bloque-r .tit b{display:block;font-size:1.02rem;letter-spacing:-.01em}
.bloque-r .tit small{display:block;color:var(--g600);font-size:.85rem;line-height:1.4}
.bloque-r .flecha{font-size:1.4rem;transition:transform .2s}
.bloque-r[open] .flecha{transform:rotate(90deg)}
.bloque-c{padding:0 16px 16px}
.nivel{border:var(--suave);border-radius:10px;padding:12px;margin-top:8px}
.nivel-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nv{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;border:1.5px solid}
.nv-riesgo{color:var(--rojo);background:var(--rojo-claro)}
.nv-minimo{color:var(--ambar);background:var(--ambar-claro)}
.nv-bien,.nv-ideal{color:var(--verde);background:var(--verde-claro)}
.nivel-dato{margin:6px 0 8px;font-size:.95rem}
.barra{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.seg{height:8px;border-radius:2px;background:var(--g300)}
.seg.lleno{border:0}
.seg.lleno.nv-riesgo{background:var(--rojo)}.seg.lleno.nv-minimo{background:var(--ambar)}.seg.lleno.nv-bien,.seg.lleno.nv-ideal{background:var(--verde)}
.barra-et{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:4px}
.barra-et span{font-size:10px;color:var(--g600);line-height:1.2}
.nivel-sig{font-size:.88rem;margin:8px 0 0}
.grupo{margin-top:14px}
.grupo>h3{margin-bottom:2px}

/* v1.3 */
.compara.tres{grid-template-columns:1fr}
@media (min-width:520px){.compara.tres{grid-template-columns:repeat(3,1fr)}}
.compara span{display:block;font-size:.85rem;color:var(--g600)}
.nivel-sig{font-size:.9rem;margin:10px 0 0;background:var(--suelo);border-radius:8px;padding:8px 10px}
.alerta{border:var(--suave);border-radius:10px;padding:14px;margin-top:10px}
.alerta.marcada{border:1.5px solid var(--ambar)}
.alerta h3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alerta .etq{margin-top:8px}
.alerta p{margin-bottom:4px}
.oculto{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<nav id="nav" aria-label="Laboratorio 3">

</nav>
<main id="app" aria-live="polite"></main>
<footer>
  <div class="pie-in">
    <p class="lema">explorar. contrastar. decidir.</p>
    <p class="per">Per experimentum.</p>
    <div class="pie-fila"><span>( UMBRAL ) · Lab 3 · Finanzas e Inversión · Ciudad de Guatemala · 2025–2027</span>

  </div>
</footer>

<script src="fin-motor.js"></script>

<script>
(function(){
'use strict';
const M = window.FinMotor;
const $app = document.getElementById('app');
if(!M){ $app.innerHTML = '<p class="aviso"><strong>Falta el archivo fin-motor.js.</strong> Debe estar en la misma carpeta que este HTML.</p>'; return; }
const CLAVE = 'umbral-foto-financiera';
const D = M.DATOS;
const ESCALERA = ['Ordenar el día a día','Fondo de emergencia inicial','Deudas','Protección','Metas','Inversión conservadora','Bienes raíces','Conexión con los otros labs'];

// ---------- Glosario: palabras que se explican al tocarlas ----------

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function glosar(texto){
  // Escapa y marca la primera aparición de cada término (una sola vez por bloque)
  let html = esc(texto); const usados = new Set();
  GLOSARIO.forEach((g, k) => {
    if(usados.has(g[1])) return;
    const re = new RegExp(g[0].source, g[0].flags.replace('g',''));
    const m = html.match(re);
    if(!m) return;
    // evita marcar dentro de una etiqueta ya insertada
    const antes = html.slice(0, m.index);
    if((antes.match(/<span role="button"/g)||[]).length !== (antes.match(/<\/span>/g)||[]).length) return;
    html = antes + `<span role="button" tabindex="0" class="term" data-g="${k}" aria-expanded="false">${m[0]}</span>` + html.slice(m.index + m[0].length);
    usados.add(g[1]);
  });
  return html;
}
// Un <span role="button"> no corta la frase como un <button>; Enter y espacio también lo abren
$app.addEventListener('keydown', e => { if((e.key==='Enter' || e.key===' ') && e.target.classList && e.target.classList.contains('term')){ e.preventDefault(); e.target.click(); } });
$app.addEventListener('click', e => {
  const b = e.target.closest('.term'); if(!b) return;
  e.preventDefault();
  const abierto = b.getAttribute('aria-expanded')==='true';
  document.querySelectorAll('.def').forEach(d => d.remove());
  document.querySelectorAll('.term[aria-expanded="true"]').forEach(x => x.setAttribute('aria-expanded','false'));
  if(abierto) return;
  const g = GLOSARIO[+b.dataset.g];
  // La definición aparece debajo del párrafo, sin cortar la frase
  const bloque = b.closest('p, li, .pregunta') || b;
  bloque.insertAdjacentHTML('afterend', `<div class="def" role="note"><b>${esc(g[1])}.</b> ${esc(g[2])}</div>`);
  b.setAttribute('aria-expanded','true');
});

    ${p.porque?`<p class="porque"><b>Por qué importa:</b> ${glosar(p.porque)}</p>`:''}
    ${cuerpo}
    <div class="error" id="error"></div>
    <div id="explica"></div>
    ${p.ayuda?`<div class="ayuda"><button class="help-icon" id="verAyuda" aria-expanded="false" aria-label="¿Dónde lo veo?">?</button><span class="help-lbl">¿Dónde lo veo?</span><div class="help-bubble oculto" id="ayuda">${esc(p.ayuda)}</div></div>`:''}
    <div class="fila"><button class="btn sec" id="atras">Atrás</button><button class="btn" id="seguir">Seguir</button></div>`;
  document.getElementById('enunciado').focus();

  const err = m => document.getElementById('error').textContent = m;
  const ayudaBtn = document.getElementById('verAyuda');
  if(ayudaBtn) ayudaBtn.onclick = () => { const a = document.getElementById('ayuda'); a.classList.toggle('oculto'); ayudaBtn.setAttribute('aria-expanded', !a.classList.contains('oculto')); };

  if(p.tipo==='opciones'){
    $app.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const o = p.opciones[+b.dataset.k]; r[p.id] = o.v;
      if(o.explica){
        // La prueba mostró que "¿Qué es eso?" pasaba sin explicar: ahora se explica antes de seguir
        $app.querySelectorAll('.op').forEach(x => x.setAttribute('aria-pressed', x===b));
        document.getElementById('explica').innerHTML = `<div class="explica" role="status"><b>Te explicamos</b><p>${glosar(o.explica)}</p></div>`;
        document.getElementById('seguir').focus();
        return;
      }
      avanzar();
    });
  }
  if(p.tipo==='multi'){
    $app.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const o = p.opciones[+b.dataset.k]; let sel = Array.isArray(r[p.id]) ? r[p.id].slice() : [];
      if(o.solo) sel = sel.includes(o.v) ? [] : [o.v];
      else { sel = sel.filter(v => !p.opciones.find(x=>x.v===v && x.solo)); sel = sel.includes(o.v) ? sel.filter(v=>v!==o.v) : sel.concat(o.v); }
      r[p.id] = sel; pregunta();
    });
  }
  if(p.tipo==='tasa'){
    $app.querySelectorAll('[data-u]').forEach(b => b.onclick = () => {
      const t = Object.assign({}, r[p.id]||{}, {unidad:b.dataset.u}); const v = document.getElementById('valor').value;
      if(v!=='') t.v = parseFloat(v.replace(',','.')); r[p.id] = t; pregunta();
    });
  }
  if(p.tipo==='desglose'){
    const leerDet = () => { const det = {}; $app.querySelectorAll('[data-c]').forEach(inp => { const n = Number(inp.value.replace(/[Q\s,]/g,'')); det[inp.dataset.c] = (inp.value.trim()==='' || !isFinite(n) || n<0) ? 0 : n; }); return det; };
    $app.querySelectorAll('[data-c]').forEach(inp => inp.addEventListener('input', () => {
      document.getElementById('total').textContent = Q(Object.values(leerDet()).reduce((a,b)=>a+b,0)); }));
    document.getElementById('nose').onclick = () => {
      // Alternativa: un solo total aproximado
      $app.querySelector('.desglose').outerHTML = `<label class="monto"><span>Q</span><input id="valor" inputmode="decimal" autocomplete="off" placeholder="0" aria-label="Total aproximado de gastos básicos"></label>`;
      document.getElementById('nose').remove(); p._total = true; document.getElementById('valor').focus();
    };
    p._leerDet = leerDet;
  }
  const nose = document.getElementById('nose'); if(nose && p.tipo!=='desglose') nose.onclick = () => { r[p.id] = null; avanzar(); };
  const inp = document.getElementById('valor');
  if(inp){ inp.addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('seguir').click(); }); }

  document.getElementById('atras').onclick = () => { if(pila.length){ i = pila.pop(); pregunta(); } else inicio(); };
  document.getElementById('seguir').onclick = () => {
    if(p.tipo==='opciones'){ if(r[p.id]===undefined) return err('Elegí una opción.'); return avanzar(); }
    if(p.tipo==='multi'){ if(!Array.isArray(r[p.id]) || !r[p.id].length) return err('Marcá al menos una opción.'); return avanzar(); }
    if(p.tipo==='desglose' && !p._total){
      const det = p._leerDet(); const total = Object.values(det).reduce((a,b)=>a+b,0);
      if(total<=0) return err('Escribí al menos un gasto, o tocá la opción de total aproximado.');
      r.q_gastos_det = det; r.q_gastos = total; return avanzar();
    }
    const el = document.getElementById('valor');
    const txt = el.value.trim().replace(/[Q\s,]/g,'');
    if(p.tipo==='tasa'){
      if(txt===''){ if(r[p.id]===null) return avanzar(); return err('Escribí la tasa o tocá "No sé".'); }
      const n = parseFloat(txt); if(!(n>0)) return err('Escribí un número mayor que cero.');
      r[p.id] = {v:n, unidad:(r[p.id]&&r[p.id].unidad)||'mensual'}; return avanzar();
    }
    if(txt===''){ if(p.tipo==='monto' && r[p.id]===null) return avanzar(); return err(p.tipo==='numero'?'Escribí tu edad.':'Escribí una cantidad o tocá "No sé".'); }
    const n = Number(txt);
    if(!isFinite(n) || n<0) return err('Escribí solo números, sin signos.');
    if(p.tipo==='numero' && (n<15 || n>100)) return err('Escribí una edad entre 15 y 100.');
    if(p.tipo==='desglose'){ r.q_gastos_det = null; }
    r[p.id] = n; avanzar();
  };
}

function avanzar(){
  limpiarDependientes();
  const lista = visibles(); const actual = lista[i];
  pila.push(i);
  const nueva = visibles(); const pos = nueva.indexOf(actual);
  i = pos + 1;
  if(i >= nueva.length) resultados(); else pregunta();
}

function meses(m){
  if(m===Infinity) return 'Tus gastos quedan cubiertos';
  if(m < 1) return 'Menos de un mes';
  const v = Math.floor(m*10)/10;
  return (Number.isInteger(v)? v : v.toFixed(1)) + (v===1?' mes':' meses');
}

function tarjetaA(A){

  const tasaP = A.prestamo ? M.fmtPct(A.prestamo.tasaAnual) : '';
  const notaP = A.prestamo ? `<p class="nota">El préstamo usa ${tasaP} anual, el promedio de los préstamos en Guatemala sin contar tarjetas (Banguat). Un préstamo personal suele cobrar más; pedí siempre el costo total en quetzales.</p>` : '';

    h += `<p class="cifra">Tu fondo de emergencia la cubre</p><p>Después de pagarla te quedarían ${Q(A.queda)}.</p>`;

    const tasaTxt = A.tasaPropia ? `tu tasa (${M.fmtPct(A.tasa,1)} al año)` : `la tasa promedio anual de las tarjetas (${M.fmtPct(D.tc_tasa_prom_mn.v)} al año, unos ${M.fmtPct(D.tc_tasa_prom_mn.v/12,1)} al mes)`;
    h += `<p class="cifra">Te faltarían ${Q(A.faltante)}</p>
      <p>${glosar(`Así se compara pagar esos ${Q(A.faltante)} con la tarjeta, a ${tasaTxt}, o con un préstamo:`)}</p>
      <div class="compara tres">
        <div><span>Tarjeta, pagando solo el mínimo</span><b>${M.fmtMeses(cf.minimo.meses)}</b>${Q(cf.minimo.totalPagado)} en total</div>
        <div><span>Tarjeta, pagando ${Q(p.cuota)} al mes</span><b>${cf.mismaCuota.nunca?'No alcanza':M.fmtMeses(cf.mismaCuota.meses)}</b>${cf.mismaCuota.nunca?'La cuota no cubre los intereses':Q(cf.mismaCuota.totalPagado)+' en total'}</div>
        <div><span>Préstamo a 12 meses</span><b>${Q(p.cuota)} al mes</b>${Q(p.total)} en total</div>
      </div>
      ${A.saldoTarjeta > A.faltante ? `<p>Si ese faltante se suma a lo que ya debés en la tarjeta (${Q(A.saldoTarjeta - A.faltante)}), pagando solo el mínimo tardarías ${M.fmtMeses(A.soloMinimo.meses)} y pagarías ${Q(A.soloMinimo.totalPagado)} en total.</p>` : ''}

  }
  return h;
}

      <p class="lugar">Estás en el peldaño ${f.peldano} de 6: ${esc(f.nombre)}</p>

      ${f.porConfirmar.length?`<p class="suave chico">Por confirmar: nos falta ${f.porConfirmar.map(k=>faltan[k]||k).join(', ')}.</p>`:''}
      <div class="siguiente"><p class="etq" style="margin-top:0">Tu siguiente paso</p>
        <p class="sig-texto">${f.siguientePaso ? glosar(f.siguientePaso) : 'Completar los datos que faltan y repetir el recorrido.'}</p>
        <p class="chico suave" style="margin:0">Es una sola cosa, a propósito. Abajo está el detalle, por si querés entender de dónde sale.</p></div>
    </section>

    ${rojo?`<div class="calma"><h3>Esto es común y tiene salida</h3>
      <p>Mucha gente en Guatemala está en una situación parecida. Este resultado no te define: es un punto de partida, y los primeros peldaños casi siempre son los más difíciles.</p>
      <p class="chico" style="margin:0">Si tenés dudas sobre una deuda con un banco o cooperativa, la Superintendencia de Bancos atiende consultas de forma gratuita: <a href="https://www.sib.gob.gt/web/sib/atencion-al-usuario/consultas" target="_blank" rel="noopener">atención al usuario de la SIB</a>. Para problemas con un comercio o proveedor, la <a href="https://diaco.gob.gt" target="_blank" rel="noopener">DIACO</a>.</p></div>`:''}

    <h2>El detalle, en cinco partes</h2>
    <p class="suave chico">Tocá cada parte para abrirla. Las palabras subrayadas se explican al tocarlas.</p>
    ${bloque('b1','1','Dónde estás: de lo mínimo a lo ideal','Cada área de tus finanzas comparada con cuatro niveles.',
      `<p class="chico">La meta no es llegar a lo ideal de golpe, sino subir un nivel a la vez. Los niveles son referencias de UMBRAL, no reglas oficiales.</p>
       ${nivelesHTML(f.niveles)}
       <p class="etq">Tus números</p>${resumenHTML(f.resumen)}`, true)}
    ${bloque('b2','2','Por qué estás en este peldaño','Lo que pide cada peldaño y lo que cumplís con tus números.', escaleraHTML(f))}
    ${bloque('b3','3','Qué pasaría si tropezás','Dos imprevistos comunes, calculados con tus números.',
      `<div class="tropiezo"><h3>Una emergencia de Q10,000</h3>${tarjetaA(f.tropiezo.A)}</div>
       <div class="tropiezo"><h3>Un mes sin ingreso</h3><div id="tb">${tarjetaB(f.tropiezo.B)}</div></div>`)}
    ${bloque('b4','4','Para entender mejor tu situación','Lo más importante que vimos en tus respuestas, ordenado por tema.',
      f.hallazgos.length ? grupoHallazgos(f.hallazgos) : '<p>No encontramos nada que destacar con tus respuestas.</p>')}
    ${bloque('b5','5','Señales de alerta','Ofertas que circulan en Guatemala y cómo reconocerlas antes de perder dinero.', alertasHTML())}

    <h2>Cuando des tu siguiente paso</h2>
    <p class="chico">Guardá este resultado y repetí el recorrido más adelante para ver si subiste de nivel.</p>
    <button class="btn" id="guardar">Guardar en este teléfono</button>
    <div class="fila"><button class="btn sec" id="repetir">Repetir</button><button class="btn sec" id="borrar">Borrar todo</button></div>
    <p id="estado" class="suave chico" role="status" style="margin-top:12px"></p>
    <p style="margin-top:20px"><button class="enlace" id="como">Cómo funciona y de dónde salen los datos</button></p>`;

  document.getElementById('titulo').focus();
  const enlazarB = () => document.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    escenarioB = b.dataset.b; document.getElementById('tb').innerHTML = tarjetaB(f.tropiezo.B); enlazarB(); });
  enlazarB();
  const estado = m => document.getElementById('estado').textContent = m;
  document.getElementById('guardar').onclick = () => estado(guardar() ? 'Guardado solo en este teléfono.' : 'Este navegador no permite guardar. Tu resultado no salió del teléfono.');
  document.getElementById('borrar').onclick = () => { borrar(); r={}; estado('Borrado. No queda nada guardado en este teléfono.'); setTimeout(inicio, 900); };
  document.getElementById('repetir').onclick = () => { r={}; pila=[]; i=0; pregunta(); };
  document.getElementById('como').onclick = comoFunciona;
}

function comoFunciona(){
  const volver = vista;
  const conf = {oficial:'Oficial', prensa:'Fuente secundaria', academico:'Académica'};
  const NOMBRES = {
    tc_tasa_prom_mn:'Tasa promedio de tarjetas de crédito', tc_mora_mn:'Deuda de tarjetas que no se paga a tiempo', tc_tasa_mensual_rango:'Tasas mensuales de tarjetas por emisor',
    tc_pago_min_pct:'Pago mínimo de la tarjeta', tc_pago_min_piso:'Pago mínimo más bajo permitido', tc_tope_tasa:'Tope legal a la tasa de tarjetas',
    tc_convenio_atrasos:'Convenio de pago por atrasos', sib_historial_meses:'Historial crediticio en la SIB', activa_sin_tc_mn:'Tasa promedio de préstamos (sin tarjetas)',
    pasiva_mn:'Tasa promedio de depósitos', isr_intereses:'ISR sobre intereses', inflacion_interanual:'Inflación interanual', tasa_lider:'Tasa líder de política monetaria',

    bono_cupo_pi:'Cupo disponible para pequeños inversionistas', igss_subsidio_frac:'Subsidio del IGSS por enfermedad', igss_subsidio_tope:'Tope diario del subsidio del IGSS',
    igss_subsidio_max:'Duración máxima del subsidio (en semanas)', igss_cuota_laboral:'Cuota laboral del IGSS', ivs_requisitos:'Requisitos de la pensión del IGSS (edad / cuotas)',
    ivs_min_max:'Pensión del IGSS mínima / máxima', ivs_formula:'Fórmula de la pensión del IGSS', isr_tarifa:'Tarifa del ISR para asalariados',
    isr_deducciones_2026:'Deducciones del ISR 2026', planilla_iva_tope:'Tope de la planilla del IVA', findex_emergencia:'Cómo cubrirían una emergencia, de cada 100',
    enifh:'Encuesta Nacional de Inclusión Financiera', informalidad:'Personas que trabajan sin contrato formal', gasto_bolsillo_salud:'Gasto de bolsillo en salud',
    day_trading_pierde:'Day traders que perdieron dinero', piramides_afectados:'Personas afectadas por pirámides', mlm_ftc_17:'Multiniveles donde la mayoría no ganó nada',
    mlm_ftc:'Ingreso anual de la mayoría en multiniveles', juego_trastorno:'Problema de juego entre quienes apuestan en línea (de cada 100)', juego_sin_regulador:'Regulador del juego en línea en Guatemala', mp_fraude_diario:'Denuncias de fraude digital al día', mp_fraude_facebook:'Fraudes digitales que vienen de Facebook (%)'};
  const VALORES = {juego_trastorno:'16 en casino · 9 en apuestas deportivas', juego_sin_regulador:'No existe', mp_fraude_diario:'Unas 50', mp_fraude_facebook:'33%',tc_pago_min_pct:'2% del saldo + intereses y cargos', tc_pago_min_piso:'Q200', sib_historial_meses:'Últimos 60 meses',
    bono_cupon:'6.000% / 6.125% / 6.250%', bono_cupo_pi:'Q295.99 millones de Q500 millones', igss_subsidio_tope:'Q150', igss_subsidio_max:'26 por enfermedad; 52 en 24 meses',
    ivs_requisitos:'60 años y 240 cuotas', ivs_min_max:'Q340 / Q7,200', isr_tarifa:'5% hasta Q300,000', informalidad:'66%', gasto_bolsillo_salud:'54%',
    day_trading_pierde:'97 de cada 100', piramides_afectados:'Más de 20,000', mlm_ftc_17:'Al menos 17 empresas', mlm_ftc:'US$1,000 o menos',
    tc_tope_tasa:'No existe', igss_subsidio_frac:'2/3 del salario', tc_convenio_atrasos:'Desde 2 atrasos', ivs_formula:'50% + 0.5% por semestre sobre 120 cuotas',
    enifh:'11% con tarjeta · 11% con seguro · 53% no sabe dónde quejarse', findex_emergencia:'85 podrían · 45 con mucha dificultad · 16 con ahorros · 34 con familia'};
  const fmtNum = (k, x) => typeof x!=='number' ? String(x) : (x>0 && x<1) ? M.fmtPct(x) : x>=1000 ? (/^(mlm|piramides|bono_cupo)/.test(k) ? x.toLocaleString('en-US') : Q(x)) : String(x);
  const fmtValor = (k, v) => VALORES[k] ? VALORES[k] : Array.isArray(v) ? v.map(x=>fmtNum(k,x)).join(' a ')
    : (v && typeof v==='object') ? Object.values(v).map(x=>fmtNum(k,x)).join(' / ') : fmtNum(k, v);
  const filas = Object.keys(D).filter(k => NOMBRES[k]).map(k => { const d = D[k];
    return `<tr><td>${esc(NOMBRES[k])}</td><td>${esc(fmtValor(k, d.v))}</td><td>${esc(d.etiqueta)}</td><td>${esc(d.fuente)}</td><td>${conf[d.conf]}</td></tr>`; }).join('');
  $app.innerHTML = `
    <p class="ceja">Laboratorio 3 · Nota de laboratorio</p>
    <h1 tabindex="-1" id="titulo">Cómo funciona la Escalera financiera</h1>
    <p>Funciona con reglas fijas basadas en datos oficiales. No usa inteligencia artificial ni se conecta a internet después de cargar. Tus respuestas no salen de este teléfono.</p>
    <h2>La escalera</h2>
    <p>Quedás en el primer peldaño cuya condición no cumplís:</p>
    <ol class="chico">
      <li>Ordenar el día a día: tus gastos y cuotas caben en tu ingreso.</li>
      <li>Fondo de emergencia inicial: tenés ahorrado al menos un mes de gastos.</li>
      <li>Deudas: no te atrasás, pagás el total de tu tarjeta (si tenés) y tus cuotas no pasan de 30% de tu ingreso. El 30% es una referencia internacional, no una norma guatemalteca.</li>
      <li>Protección: tenés 3 meses de gastos (6 si sos el único ingreso) y seguro médico. La regla de 3 a 6 meses es una convención internacional.</li>
      <li>Metas: ahorrás algo aparte para tu retiro.</li>
      <li>Inversión conservadora: cumplís todo lo anterior.</li>
    </ol>
    <h2>Los datos</h2>
    <p>Cada número viene de una fuente pública con fecha. "Fuente secundaria" significa que leímos la norma en prensa o en una consultora y aún no en su texto oficial.</p>
    <div class="tabla"><table><thead><tr><th>Dato</th><th>Valor</th><th>Fecha</th><th>Fuente</th><th>Tipo</th></tr></thead><tbody>${filas}</tbody></table></div>

  document.getElementById('titulo').focus();
  document.getElementById('volver').onclick = () => volver==='resultados' ? resultados() : volver==='pregunta' ? pregunta() : inicio();
}


inicio();
})();

</script>
